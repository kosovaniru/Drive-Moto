<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <div class="header__top">
          <nav class="header__top-nav">
            <ul class="header__top-list">
              <li class="header__top-items">
                <a href="#" class="header__top-link section-title">Магазини</a>
              </li>
              <li class="header__top-items">
                <a href="#" class="header__top-link section-title">Акції</a>
              </li>
              <li class="header__top-items">
                <a href="#" class="header__top-link section-title">Доставка та оплата</a>
              </li>
            </ul>
          </nav>
          <a href="#" class="logo header__top-logo">
            <img class="header__top-img" src="images/icons/moto-logo.svg" alt="Лого компанії Drive-Moto">
          </a>
          <div class="header__top-info">
            <a href="#" class="header__top-addres">Київ, вул. Науки 25</a>
            <ul class="user-list">
              <li class="user-list__item">
                <a class="user-list__link" href="#">
                  <img src="images/icons/heart.svg" alt="" class="user-list__img">
                </a>
              </li>
              <li class="user-list__item">
                <a class="user-list__link" href="#">
                  <img src="images/icons/cabinet.svg" alt="" class="user-list__img">
                </a>
              </li>
              <li class="user-list__item">
                <a class="user-list__link" href="#">
                  <img src="images/icons/cart.svg" alt="" class="user-list__img">
                  <p class="user-list__num">1</p>
                </a>
              </li>
            </ul>
          </div>
        </div>

        <div class="header__bottom">
          <ul class="header__categories">
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Квадроцикли</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Катери</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Гідроцикли</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Лодки</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Всюдиходи</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Снігоходи</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Двигуни</a>
            </li>
            <li class="header__categories-item">
              <a class="header__categories-link" href="#">Запчастини</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="top">
      <div class="container">
        <div class="top__inner">
          <ul class="top__slider">
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
            <li class="top__item">
              <img class="top__img" src="images/top/top-slider-1.jpg" alt="">
            </li>
          </ul>

          <div class="top__banner">

          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">

  </footer>
  <script src="js/main.min.js"></script>
</body>
</html>
